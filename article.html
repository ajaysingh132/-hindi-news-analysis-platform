<script>

  /* =====================================================
     ARTICLE DATA
  ===================================================== */


  const PUBLISHED_KEY =
    "newsroom_published_article";


  function getStoredArticle() {

    const published =
      localStorage.getItem(
        PUBLISHED_KEY
      );


    if (!published) {

      return null;

    }


    try {

      const article =
        JSON.parse(
          published
        );


      if (
        !article ||
        article.status !==
        "published"
      ) {

        return null;

      }


      return article;

    } catch (error) {

      console.error(
        "Published article parse error:",
        error
      );

      return null;

    }

  }



  /* =====================================================
     REQUESTED URL SLUG
  ===================================================== */


  function getRequestedSlug() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const slug =
      params.get(
        "slug"
      );


    if (!slug) {

      return "";

    }


    return slug.trim();

  }



  /* =====================================================
     ARTICLE / URL MATCH
  ===================================================== */


  function articleMatchesRequestedSlug(
    article
  ) {

    const requestedSlug =
      getRequestedSlug();


    /*
     * पुराने direct article URL
     * के लिए slug optional रखा गया है।
     */

    if (!requestedSlug) {

      return true;

    }


    if (
      !article ||
      !article.slug
    ) {

      return false;

    }


    return (
      String(article.slug).trim() ===
      String(requestedSlug).trim()
    );

  }



  /* =====================================================
     TEXT UTILITIES
  ===================================================== */


  function escapeHTML(
    value
  ) {

    return String(
      value ?? ""
    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }



  function escapeAttribute(
    value
  ) {

    return escapeHTML(
      value
    );

  }



  /* =====================================================
     BASIC HTML SANITIZER
  ===================================================== */


  function sanitizeArticleHTML(
    html
  ) {

    const wrapper =
      document.createElement(
        "div"
      );


    wrapper.innerHTML =
      String(
        html || ""
      );


    const forbidden =
      wrapper.querySelectorAll(
        "script, style, iframe, object, embed, form, meta, link"
      );


    forbidden.forEach(
      element => {
        element.remove();
      }
    );


    wrapper
      .querySelectorAll("*")
      .forEach(
        element => {

          [...element.attributes]
            .forEach(
              attribute => {

                const name =
                  attribute.name.toLowerCase();

                const value =
                  attribute.value.trim();


                /*
                 * Event handlers जैसे
                 * onclick / onerror हटाएँ।
                 */

                if (
                  name.startsWith(
                    "on"
                  )
                ) {

                  element.removeAttribute(
                    attribute.name
                  );

                  return;

                }


                /*
                 * Dangerous URLs रोकें।
                 */

                if (
                  (
                    name === "href" ||
                    name === "src" ||
                    name === "action"
                  ) &&
                  /^(javascript|data|vbscript):/i.test(
                    value
                  )
                ) {

                  element.removeAttribute(
                    attribute.name
                  );

                }

              }
            );

        }
      );


    /*
     * External links को सुरक्षित रखें।
     */

    wrapper
      .querySelectorAll(
        "a[href]"
      )
      .forEach(
        link => {

          link.setAttribute(
            "target",
            "_blank"
          );

          link.setAttribute(
            "rel",
            "noopener noreferrer"
          );

        }
      );


    return wrapper.innerHTML;

  }



  /* =====================================================
     DATE FORMAT
  ===================================================== */


  function formatDate(
    value
  ) {

    if (!value) {

      return "";

    }


    const date =
      new Date(
        value
      );


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return String(
        value
      );

    }


    return new Intl.DateTimeFormat(
      "hi-IN",
      {
        dateStyle:
          "long",

        timeStyle:
          "short"
      }
    ).format(
      date
    );

  }



  /* =====================================================
     READING TIME
  ===================================================== */


  function calculateReadingTime(
    html
  ) {

    const temporary =
      document.createElement(
        "div"
      );


    temporary.innerHTML =
      html || "";


    const text =
      temporary.textContent ||
      temporary.innerText ||
      "";


    const words =
      text
        .trim()
        .split(
          /\s+/u
        )
        .filter(
          Boolean
        );


    if (!words.length) {

      return 1;

    }


    return Math.max(
      1,
      Math.ceil(
        words.length / 200
      )
    );

  }



  /* =====================================================
     ARRAY HELPERS
  ===================================================== */


  function normalizeArray(
    value
  ) {

    if (
      !Array.isArray(
        value
      )
    ) {

      return [];

    }


    return value
      .filter(
        item =>
          item !== null &&
          item !== undefined &&
          String(item).trim() !== ""
      );

  }



  /* =====================================================
     ARTICLE FIELD HELPERS
  ===================================================== */


  function getArticleTitle(
    article
  ) {

    return (
      article.title ||
      article.headline ||
      "समाचार एवं विश्लेषण"
    );

  }



  function getArticleExcerpt(
    article
  ) {

    return (
      article.excerpt ||
      article.summary ||
      article.description ||
      ""
    );

  }



  function getArticleCategory(
    article
  ) {

    return (
      article.category ||
      article.section ||
      "लेख"
    );

  }



  function getArticleAuthor(
    article
  ) {

    return (
      article.author ||
      article.authorName ||
      "GBSBFORYOU"
    );

  }



  function getArticleContent(
    article
  ) {

    return (
      article.content ||
      article.body ||
      article.articleContent ||
      ""
    );

  }



  function getArticleImage(
    article
  ) {

    return (
      article.featuredImage ||
      article.image ||
      article.imageUrl ||
      ""
    );

  }



  function getArticleCaption(
    article
  ) {

    return (
      article.imageCaption ||
      article.featuredImageCaption ||
      article.caption ||
      ""
    );

  }



  /* =====================================================
     META / SEO
  ===================================================== */


  function updateSEO(
    article
  ) {

    const title =
      getArticleTitle(
        article
      );


    const excerpt =
      getArticleExcerpt(
        article
      );


    const image =
      getArticleImage(
        article
      );


    const url =
      window.location.href;


    document.title =
      `${title} | GBSBFORYOU`;


    const metaDescription =
      document.getElementById(
        "metaDescription"
      );


    if (
      metaDescription
    ) {

      metaDescription.setAttribute(
        "content",
        excerpt || title
      );

    }


    const ogTitle =
      document.getElementById(
        "ogTitle"
      );


    if (ogTitle) {

      ogTitle.setAttribute(
        "content",
        title
      );

    }


    const ogDescription =
      document.getElementById(
        "ogDescription"
      );


    if (ogDescription) {

      ogDescription.setAttribute(
        "content",
        excerpt
      );

    }


    const ogImage =
      document.getElementById(
        "ogImage"
      );


    if (
      ogImage &&
      image
    ) {

      ogImage.setAttribute(
        "content",
        image
      );

    }


    const ogUrl =
      document.getElementById(
        "ogUrl"
      );


    if (ogUrl) {

      ogUrl.setAttribute(
        "content",
        url
      );

    }


    const canonical =
      document.getElementById(
        "canonicalUrl"
      );


    if (canonical) {

      canonical.setAttribute(
        "href",
        url
      );

    }

  }



  /* =====================================================
     TAGS
  ===================================================== */


  function renderTags(
    tags
  ) {

    const list =
      normalizeArray(
        tags
      );


    if (!list.length) {

      return "";

    }


    return `
      <div class="tags">

        ${list
          .map(
            tag => `
              <span class="tag">
                ${escapeHTML(tag)}
              </span>
            `
          )
          .join("")
        }

      </div>
    `;

  }



  /* =====================================================
     SOURCES
  ===================================================== */


  function renderSources(
    sources
  ) {

    const list =
      normalizeArray(
        sources
      );


    if (!list.length) {

      return "";

    }


    const items =
      list
        .map(
          source => {

            /*
             * Source object
             */

            if (
              typeof source ===
              "object"
            ) {

              const name =
                source.name ||
                source.title ||
                source.label ||
                source.url ||
                "स्रोत";


              const url =
                source.url ||
                source.href ||
                "";


              if (url) {

                return `
                  <li>
                    <a
                      href="${escapeAttribute(url)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      ${escapeHTML(name)}
                    </a>
                  </li>
                `;

              }


              return `
                <li>
                  ${escapeHTML(name)}
                </li>
              `;

            }


            /*
             * Plain URL
             */

            const text =
              String(
                source
              ).trim();


            if (
              /^https?:\/\//i.test(
                text
              )
            ) {

              return `
                <li>
                  <a
                    href="${escapeAttribute(text)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${escapeHTML(text)}
                  </a>
                </li>
              `;

            }


            return `
              <li>
                ${escapeHTML(text)}
              </li>
            `;

          }
        )
        .join("");


    return `
      <section class="sources-section">

        <h2 class="section-title">
          स्रोत
        </h2>

        <ol class="sources-list">
          ${items}
        </ol>

      </section>
    `;

  }



  /* =====================================================
     FACT CHECK
  ===================================================== */


  function renderFactCheck(
    article
  ) {

    const factCheck =
      article.factCheck ||
      article.factcheck ||
      article.fact_check;


    if (!factCheck) {

      return "";

    }


    let text =
      "";

    let status =
      "जाँच उपलब्ध";


    if (
      typeof factCheck ===
      "string"
    ) {

      text =
        factCheck;

    } else {

      text =
        factCheck.summary ||
        factCheck.description ||
        factCheck.result ||
        factCheck.notes ||
        "";


      status =
        factCheck.status ||
        factCheck.verdict ||
        "जाँच उपलब्ध";

    }


    if (!text) {

      return "";

    }


    return `
      <section class="fact-card">

        <div class="fact-card-header">

          <div class="fact-card-title">
            फैक्ट चेक
          </div>

          <span class="fact-badge">
            ${escapeHTML(status)}
          </span>

        </div>

        <p>
          ${escapeHTML(text)}
        </p>

      </section>
    `;

  }



  /* =====================================================
     HERO
  ===================================================== */


  function renderHero(
    article
  ) {

    const image =
      getArticleImage(
        article
      );


    const caption =
      getArticleCaption(
        article
      );


    if (!image) {

      return "";

    }


    return `
      <figure class="hero">

        <img
          src="${escapeAttribute(image)}"
          alt="${escapeAttribute(
            getArticleTitle(article)
          )}"
          loading="eager"
        >

        ${
          caption
            ? `
              <figcaption class="hero-caption">
                ${escapeHTML(caption)}
              </figcaption>
            `
            : ""
        }

      </figure>
    `;

  }



  /* =====================================================
     AUTHOR SIDEBAR
  ===================================================== */


  function renderAuthorCard(
    article
  ) {

    const author =
      getArticleAuthor(
        article
      );


    const role =
      article.authorRole ||
      article.role ||
      "लेखक / विश्लेषक";


    const initial =
      String(
        author
      )
        .trim()
        .charAt(0) ||
      "A";


    return `
      <aside class="side-card">

        <h2 class="side-card-title">
          लेखक
        </h2>

        <div class="author-box">

          <div class="author-avatar">
            ${escapeHTML(initial)}
          </div>

          <div>

            <div class="author-name">
              ${escapeHTML(author)}
            </div>

            <div class="author-role">
              ${escapeHTML(role)}
            </div>

          </div>

        </div>

      </aside>
    `;

  }



  /* =====================================================
     READING INFO
  ===================================================== */


  function renderReadingCard(
    article,
    content
  ) {

    const minutes =
      calculateReadingTime(
        content
      );


    const publishedAt =
      article.publishedAt ||
      article.publishDate ||
      article.createdAt;


    return `
      <aside class="side-card">

        <h2 class="side-card-title">
          लेख जानकारी
        </h2>

        <div class="reading-box">

          <span class="reading-label">
            पढ़ने का समय
          </span>

          <span class="reading-value">
            ${minutes} मिनट
          </span>

        </div>

        <div class="reading-box">

          <span class="reading-label">
            प्रकाशित
          </span>

          <span class="reading-value">
            ${escapeHTML(
              publishedAt
                ? formatDate(publishedAt)
                : "—"
            )}
          </span>

        </div>

      </aside>
    `;

  }
    /* =====================================================
     ARTICLE ERROR MESSAGE
  ===================================================== */


  function renderError(
    title,
    message
  ) {

    const container =
      document.getElementById(
        "articleContainer"
      );


    if (!container) {
      return;
    }


    container.innerHTML = `
      <div class="message">

        <h1>
          ${escapeHTML(title)}
        </h1>

        <p>
          ${escapeHTML(message)}
        </p>

        <a
          class="message-action"
          href="index.html"
        >
          मुख्य पृष्ठ पर जाएँ
        </a>

      </div>
    `;

  }



  /* =====================================================
     ARTICLE HEADER
  ===================================================== */


  function renderArticleHeader(
    article
  ) {

    const title =
      getArticleTitle(
        article
      );


    const excerpt =
      getArticleExcerpt(
        article
      );


    const category =
      getArticleCategory(
        article
      );


    const author =
      getArticleAuthor(
        article
      );


    const publishedAt =
      article.publishedAt ||
      article.publishDate ||
      article.createdAt ||
      "";


    return `
      <header class="article-header">

        <div class="category-label">
          ${escapeHTML(category)}
        </div>

        <h1 class="article-title">
          ${escapeHTML(title)}
        </h1>

        ${
          excerpt
            ? `
              <p class="article-excerpt">
                ${escapeHTML(excerpt)}
              </p>
            `
            : ""
        }

        <div class="article-meta">

          <span>
            ${escapeHTML(author)}
          </span>

          ${
            publishedAt
              ? `
                <span class="meta-separator">
                  •
                </span>

                <span>
                  ${escapeHTML(
                    formatDate(
                      publishedAt
                    )
                  )}
                </span>
              `
              : ""
          }

          ${
            article.updatedAt &&
            article.updatedAt !==
              publishedAt
              ? `
                <span class="meta-separator">
                  •
                </span>

                <span>
                  अपडेट:
                  ${escapeHTML(
                    formatDate(
                      article.updatedAt
                    )
                  )}
                </span>
              `
              : ""
          }

        </div>

      </header>
    `;

  }



  /* =====================================================
     SHARE BUTTONS
  ===================================================== */


  function renderShareRow() {

    return `
      <div class="share-row">

        <span class="share-label">
          साझा करें
        </span>

        <button
          type="button"
          class="share-button"
          data-share-action="native"
        >
          शेयर
        </button>

        <button
          type="button"
          class="share-button"
          data-share-action="copy"
        >
          लिंक कॉपी करें
        </button>

        <button
          type="button"
          class="share-button"
          data-share-action="print"
        >
          प्रिंट
        </button>

      </div>
    `;

  }



  /* =====================================================
     SHARE ACTIONS
  ===================================================== */


  async function shareArticle() {

    const url =
      window.location.href;


    const title =
      document.title;


    if (
      navigator.share
    ) {

      try {

        await navigator.share({
          title:
            title,

          url:
            url
        });

        return;

      } catch (error) {

        /*
         * User ने share dialog बंद किया हो
         * तो कोई error message आवश्यक नहीं।
         */

        if (
          error &&
          error.name ===
          "AbortError"
        ) {

          return;

        }

      }

    }


    await copyArticleLink();

  }



  async function copyArticleLink() {

    const url =
      window.location.href;


    try {

      await navigator.clipboard.writeText(
        url
      );


      showTemporaryMessage(
        "लेख का लिंक कॉपी हो गया।"
      );

    } catch (error) {

      /*
       * Clipboard API उपलब्ध न होने पर
       * fallback method।
       */

      const input =
        document.createElement(
          "input"
        );


      input.value =
        url;


      document.body.appendChild(
        input
      );


      input.select();


      try {

        document.execCommand(
          "copy"
        );

        showTemporaryMessage(
          "लेख का लिंक कॉपी हो गया।"
        );

      } catch (copyError) {

        console.error(
          "Copy failed:",
          copyError
        );

        showTemporaryMessage(
          "लिंक कॉपी नहीं हो सका।"
        );

      }


      input.remove();

    }

  }



  function showTemporaryMessage(
    message
  ) {

    const existing =
      document.getElementById(
        "articleToast"
      );


    if (existing) {

      existing.remove();

    }


    const toast =
      document.createElement(
        "div"
      );


    toast.id =
      "articleToast";


    toast.textContent =
      message;


    toast.style.position =
      "fixed";

    toast.style.left =
      "50%";

    toast.style.bottom =
      "25px";

    toast.style.transform =
      "translateX(-50%)";

    toast.style.zIndex =
      "9999";

    toast.style.padding =
      "10px 15px";

    toast.style.borderRadius =
      "8px";

    toast.style.background =
      "#111827";

    toast.style.color =
      "#fff";

    toast.style.fontSize =
      "12px";

    toast.style.fontWeight =
      "700";

    toast.style.boxShadow =
      "0 8px 30px rgba(0,0,0,.18)";


    document.body.appendChild(
      toast
    );


    window.setTimeout(
      () => {

        toast.remove();

      },
      2200
    );

  }



  /* =====================================================
     SHARE EVENT BINDING
  ===================================================== */


  function setupShareButtons() {

    document
      .querySelectorAll(
        "[data-share-action]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            async () => {

              const action =
                button.dataset
                  .shareAction;


              if (
                action ===
                "native"
              ) {

                await shareArticle();

                return;

              }


              if (
                action ===
                "copy"
              ) {

                await copyArticleLink();

                return;

              }


              if (
                action ===
                "print"
              ) {

                window.print();

              }

            }
          );

        }
      );

  }



  /* =====================================================
     BREADCRUMB
  ===================================================== */


  function updateBreadcrumb(
    article
  ) {

    const element =
      document.getElementById(
        "breadcrumbCategory"
      );


    if (!element) {
      return;
    }


    element.textContent =
      getArticleCategory(
        article
      );

  }



  /* =====================================================
     ARTICLE RENDER
  ===================================================== */


  function renderArticle(
    article
  ) {

    const container =
      document.getElementById(
        "articleContainer"
      );


    if (!container) {

      console.error(
        "articleContainer not found."
      );

      return;

    }


    const title =
      getArticleTitle(
        article
      );


    const content =
      sanitizeArticleHTML(
        getArticleContent(
          article
        )
      );


    const sources =
      article.sources ||
      article.references ||
      article.sourceList ||
      [];


    const tags =
      article.tags ||
      article.keywords ||
      [];


    const hero =
      renderHero(
        article
      );


    const header =
      renderArticleHeader(
        article
      );


    const share =
      renderShareRow();


    const factCheck =
      renderFactCheck(
        article
      );


    const sourcesHTML =
      renderSources(
        sources
      );


    const tagsHTML =
      renderTags(
        tags
      );


    const authorCard =
      renderAuthorCard(
        article
      );


    const readingCard =
      renderReadingCard(
        article,
        content
      );


    /*
     * यदि content खाली है,
     * तो article body में स्पष्ट संदेश।
     */

    const body =
      content.trim()
        ? content
        : `
          <p>
            इस लेख की सामग्री अभी उपलब्ध नहीं है।
          </p>
        `;


    container.innerHTML = `

      ${header}

      ${hero}

      <div class="content-layout">

        <article
          class="article-body"
          id="articleBody"
        >

          ${body}

          ${share}

          ${factCheck}

          ${sourcesHTML}

          ${tagsHTML}

        </article>


        <aside>

          ${authorCard}

          ${readingCard}

        </aside>

      </div>

    `;


    /*
     * Page level metadata
     */

    updateSEO(
      article
    );


    updateBreadcrumb(
      article
    );


    /*
     * Share buttons
     */

    setupShareButtons();


    /*
     * Accessibility
     */

    const articleBody =
      document.getElementById(
        "articleBody"
      );


    if (articleBody) {

      articleBody.setAttribute(
        "aria-label",
        title
      );

    }

  }



  /* =====================================================
     LOAD ARTICLE
  ===================================================== */


  function loadArticle() {

    /*
     * केवल published article पढ़ें।
     */

    const article =
      getStoredArticle();


    /*
     * Published article उपलब्ध नहीं है।
     */

    if (!article) {

      renderError(
        "लेख उपलब्ध नहीं है",
        "यह लेख प्रकाशित नहीं है या अभी उपलब्ध नहीं कराया गया है।"
      );

      return;

    }


    /*
     * URL में slug दिया गया है तो
     * वही article खुलना चाहिए।
     *
     * गलत slug होने पर किसी दूसरे article
     * को दिखाना नहीं है।
     */

    if (
      !articleMatchesRequestedSlug(
        article
      )
    ) {

      renderError(
        "लेख नहीं मिला",
        "यह URL किसी प्रकाशित लेख से मेल नहीं खाता।"
      );

      return;

    }


    /*
     * सभी checks सफल होने के बाद
     * article render करें।
     */

    renderArticle(
      article
    );

  }



  /* =====================================================
     FOOTER YEAR
  ===================================================== */


  function updateFooterYear() {

    const year =
      document.getElementById(
        "footerYear"
      );


    if (year) {

      year.textContent =
        new Date()
          .getFullYear();

    }

  }



  /* =====================================================
     GLOBAL ERROR PROTECTION
  ===================================================== */


  window.addEventListener(
    "error",
    event => {

      console.error(
        "Article page error:",
        event.error ||
        event.message
      );

    }
  );



  /* =====================================================
     INITIALIZE ARTICLE PAGE
  ===================================================== */


  document.addEventListener(
    "DOMContentLoaded",
    () => {

      updateFooterYear();

      loadArticle();

    }
  );

</script>
