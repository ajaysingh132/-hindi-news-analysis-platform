  <script>

    /* =====================================================
       UTILITIES
    ===================================================== */


    function escapeHTML(value) {

      return String(value ?? "")

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    function escapeAttribute(value) {

      return escapeHTML(
        value
      );

    }



    /* =====================================================
       DATE FORMAT
    ===================================================== */


    function formatDate(value) {

      if (!value) {
        return "";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return value;

      }


      return new Intl.DateTimeFormat(
        "hi-IN",
        {
          dateStyle: "long",
          timeStyle: "short"
        }
      ).format(
        date
      );

    }



    /* =====================================================
       READING TIME
    ===================================================== */


    function calculateReadingTime(
      html
    ) {

      const temporary =
        document.createElement(
          "div"
        );


      temporary.innerHTML =
        html || "";


      const text =
        temporary.textContent ||
        temporary.innerText ||
        "";


      const words =
        text
          .trim()
          .split(
            /\s+/u
          )
          .filter(Boolean);


      if (!words.length) {
        return 1;
      }


      return Math.max(
        1,
        Math.ceil(
          words.length / 200
        )
      );

    }



    /* =====================================================
       GET ARTICLE FROM STORAGE
    ===================================================== */


    function getStoredArticle() {

      const published =
        localStorage.getItem(
          "newsroom_published_article"
        );


      if (published) {

        try {

          return JSON.parse(
            published
          );

        } catch (error) {

          console.error(
            "Published article parse error:",
            error
          );

        }

      }


      const draft =
        localStorage.getItem(
          "newsroom_article_draft"
        );


      if (draft) {

        try {

          const article =
            JSON.parse(
              draft
            );


          /*
           * Public page पर draft नहीं दिखाना।
           */

          if (
            article.status ===
            "published"
          ) {

            return article;

          }

        } catch (error) {

          console.error(
            "Draft parse error:",
            error
          );

        }

      }


      return null;

    }



    /* =====================================================

    ===================================================== */
/* =====================================================
   URL SLUG
===================================================== */


function getRequestedSlug() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const querySlug =
    params.get(
      "slug"
    );


  if (querySlug) {

    return querySlug.trim();

  }


  return "";

}



/* =====================================================
   ARTICLE SLUG MATCH
===================================================== */


function articleMatchesRequestedSlug(
  article
) {

  const requestedSlug =
    getRequestedSlug();


  /*
   * यदि URL में slug नहीं है,
   * तो मौजूदा व्यवहार बनाए रखें।
   */

  if (!requestedSlug) {

    return true;

  }


  /*
   * Article या slug उपलब्ध नहीं है।
   */

  if (
    !article ||
    !article.slug
  ) {

    return false;

  }


  return (
    String(article.slug).trim() ===
    String(requestedSlug).trim()
  );

}
