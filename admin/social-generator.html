    const PLATFORM_LIMITS = {
      facebook: 63206,
      x: 280,
      instagram: 2200,
      whatsapp: 65536,
      telegram: 4096,
      linkedin: 3000
    };


    const PLATFORM_NAMES = {
      facebook: "Facebook",
      x: "X / Twitter",
      instagram: "Instagram",
      whatsapp: "WhatsApp",
      telegram: "Telegram",
      linkedin: "LinkedIn"
    };


    const PLATFORM_BADGES = {
      facebook: "FB",
      x: "X",
      instagram: "IG",
      whatsapp: "WA",
      telegram: "TG",
      linkedin: "LI"
    };


    function cleanText(value) {
      return normalizeWhitespace(value)
        .replace(/\n{3,}/g, "\n\n");
    }


    function getHashtagText(input) {
      if (!input.hashtags) {
        return "";
      }

      const tags = input.hashtags
        .split(/[\s,]+/)
        .map(tag => tag.trim())
        .filter(Boolean)
        .map(tag => {
          const clean = tag.replace(/^#+/, "");

          return clean
            ? `#${clean.replace(/\s+/g, "")}`
            : "";
        })
        .filter(Boolean);

      return Array.from(new Set(tags)).join(" ");
    }


    function buildArticleLink(input) {
      if (!input.url) {
        return "";
      }

      return input.url;
    }


    function trimToLimit(text, limit) {
      const value = String(text || "");

      if (value.length <= limit) {
        return value;
      }

      if (limit <= 3) {
        return value.slice(0, limit);
      }

      return value
        .slice(0, limit - 3)
        .trimEnd() + "...";
    }


    function generateFacebookContent(input) {
      const hashtags = getHashtagText(input);
      const url = buildArticleLink(input);

      const parts = [
        input.title,
        "",
        input.summary
      ];

      if (url) {
        parts.push("", `पूरी खबर: ${url}`);
      }

      if (hashtags) {
        parts.push("", hashtags);
      }

      return trimToLimit(
        parts.join("\n"),
        PLATFORM_LIMITS.facebook
      );
    }


    function generateXContent(input) {
      const hashtags = getHashtagText(input);
      const url = buildArticleLink(input);

      let content =
        `${input.title}\n\n${input.summary}`;

      if (url) {
        content += `\n\n${url}`;
      }

      if (hashtags) {
        content += `\n${hashtags}`;
      }

      return trimToLimit(
        content,
        PLATFORM_LIMITS.x
      );
    }


    function generateInstagramContent(input) {
      const hashtags = getHashtagText(input);
      const url = buildArticleLink(input);

      const parts = [
        `📰 ${input.title}`,
        "",
        input.summary
      ];

      if (url) {
        parts.push(
          "",
          `पूरी खबर: ${url}`
        );
      }

      if (hashtags) {
        parts.push(
          "",
          hashtags
        );
      }

      return trimToLimit(
        parts.join("\n"),
        PLATFORM_LIMITS.instagram
      );
    }


    function generateWhatsAppContent(input) {
      const hashtags = getHashtagText(input);
      const url = buildArticleLink(input);

      const parts = [
        `📰 ${input.title}`,
        "",
        input.summary
      ];

      if (url) {
        parts.push(

          `पढ़ें: ${url}`
        );

      if (hashtags) {

          "",

        );
      }

      return trimToLimit(
        parts.join("\n"),
        PLATFORM_LIMITS.whatsapp
      );
    }


    function generateTelegramContent(input) {
      const hashtags = getHashtagText(input);
      const url = buildArticleLink(input);

      const parts = [
        `📰 ${input.title}`,
        "",
        input.summary
      ];

      if (url) {
        parts.push(
          "",
          `पूरी खबर पढ़ें: ${url}`

      if (hashtags) {
        parts.push(
          "",

        );
      }

      return trimToLimit(
        parts.join("\n"),
        PLATFORM_LIMITS.telegram
      );
    }


    function generateLinkedInContent(input) {
      const hashtags = getHashtagText(input);
      const url = buildArticleLink(input);

      const parts = [
        input.title,
        "",
        input.summary
      ];

      if (url) {
        parts.push(
          "",
          `पूरी खबर: ${url}`
        );

      if (hashtags) {
        parts.push(

        );
      }

      return trimToLimit(
        parts.join("\n"),
        PLATFORM_LIMITS.linkedin
      );
    }


    function generatePlatformContent(platform, input) {

      switch (platform) {

        case "facebook":
          return generateFacebookContent(input);

        case "x":
          return generateXContent(input);

        case "instagram":
          return generateInstagramContent(input);

        case "whatsapp":
          return generateWhatsAppContent(input);

        case "telegram":
          return generateTelegramContent(input);

        case "linkedin":
          return generateLinkedInContent(input);

        default:
          return "";
      }
    }


    function getLimitStatus(text, limit) {
      const length = String(text || "").length;

      if (length > limit) {
        return {
          className: "over-limit",
          label: `${length} / ${limit} — सीमा से अधिक`
        };
      }

      return {
        className: "within-limit",
        label: `${length} / ${limit}`
      };
    }


    function createOutputCard(platform, content) {

      const safePlatform =
        escapeHtml(platform);

      const safeName =
        escapeHtml(
          PLATFORM_NAMES[platform] || platform
        );

      const badge =
        escapeHtml(
          PLATFORM_BADGES[platform] || "S"
        );

      const safeContent =
        escapeHtml(content);

      const limit =
        PLATFORM_LIMITS[platform] || 0;

      const status =
        getLimitStatus(content, limit);

      return `
        <article
          class="output-card"
          data-platform="${safePlatform}"
        >

          <div class="output-card-header">

            <div class="output-title">

              <span class="platform-badge">
                ${badge}
              </span>

              <strong>
                ${safeName}
              </strong>

            </div>


            <div class="output-actions">

              <button
                class="btn btn-secondary btn-small copy-output"
                type="button"
                data-platform="${safePlatform}"
              >
                Copy
              </button>

              <button
                class="btn btn-secondary btn-small regenerate-output"
                type="button"
                data-platform="${safePlatform}"
              >
                Regenerate
              </button>

            </div>

          </div>


          <div class="output-body">

            <textarea
              class="output-text"
              data-output-platform="${safePlatform}"
              aria-label="${safeName} generated content"
            >${safeContent}</textarea>


            <div class="output-footer">

              <span class="output-count ${status.className}">
                ${status.label}
              </span>

              <span>

              </span>

            </div>

          </div>

        </article>
      `;
    }


    function renderOutputs(results) {

      if (!results.length) {

        elements.outputContainer.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">!</div>

            <h3>
              कोई platform selected नहीं है

      elements.outputContainer.innerHTML = `

            )
            .join("")}

    }


    function updateOutputCounter(textarea) {

      const platform =
        textarea.dataset.outputPlatform;

      const limit =
        PLATFORM_LIMITS[platform] || 0;

      const status =
        getLimitStatus(
          textarea.value,
          limit
        );

      const card =
        textarea.closest(".output-card");

      if (!card) {
        return;
      }

      const counter =
        card.querySelector(".output-count");

      if (!counter) {
        return;
      }

      counter.textContent =
        status.label;

      counter.className =
        `output-count ${status.className}`;
    }


    async function copyText(text) {

      if (!text) {
        showStatus(
          "Copy करने के लिए कोई content उपलब्ध नहीं है।",
          "error"
        );

        return false;
      }


      try {

        await navigator.clipboard.writeText(text);

        return true;

      } catch (error) {

        /*
         * Clipboard API unavailable होने की स्थिति में
         * legacy fallback।
         */

        try {

          const temporary =
            document.createElement("textarea");

          temporary.value = text;

          temporary.style.position = "fixed";
          temporary.style.opacity = "0";

          document.body.appendChild(
            temporary
          );

          temporary.focus();
          temporary.select();

          const copied =
            document.execCommand("copy");

          temporary.remove();

          return copied;

        } catch (fallbackError) {

          console.error(
            "Copy failed:",
            fallbackError
          );

          return false;
        }
      }
    }


    async function copyOutput(platform) {

      const textarea =
        document.querySelector(
          `[data-output-platform="${platform}"]`
        );

      if (!textarea) {
        showStatus(
          "Content नहीं मिला।",
          "error"
        );

        return;
      }

      const copied =
        await copyText(
          textarea.value
        );

      if (copied) {

        showStatus(
          `${PLATFORM_NAMES[platform]} content clipboard में copy हो गया।`,
          "success"
        );

      } else {

        showStatus(
          "Content copy नहीं हो सका।",
          "error"
        );
      }
    }


    function regeneratePlatform(platform) {

      const input =
        getCurrentInput();

      if (!input.title || !input.summary) {

        showStatus(
          "Regenerate करने से पहले title और summary भरें।",
          "error"
        );

        return;
      }


      const content =
        generatePlatformContent(
          platform,
          input
        );


      const textarea =
        document.querySelector(
          `[data-output-platform="${platform}"]`
        );


      if (!textarea) {
        return;
      }


      textarea.value =
        content;

      updateOutputCounter(
        textarea
      );


      showStatus(
        `${PLATFORM_NAMES[platform]} content regenerate हो गया।`,
        "success"
      );
    }


    function attachOutputEvents() {

      const copyButtons =
        document.querySelectorAll(
          ".copy-output"
        );

      copyButtons.forEach(button => {

      regenerateButtons.forEach(button => {

      textareas.forEach(textarea => {

        textarea.addEventListener(
          "input",
          () => {
            updateOutputCounter(
              textarea
            );
          }
        );

      });
    }
