    ===================================================== */

   <script>
/* =========================================================
   हिन्दी न्यूज़रूम — Article Editor
   PART 2/3 — Editor Mechanics & Data Layer
   ========================================================= */

const DRAFT_KEY =
  "newsroom_article_draft";

const PUBLISHED_KEY =
  "newsroom_published_article";

let currentTags = [];

let sourceCounter = 1;

let slugManuallyEdited = false;

let isDirty = false;


/* =========================================================
   सामान्य उपयोगिता
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/*
 * Rich text को basic safe HTML में बदलना।
 * MVP स्तर पर script, iframe और event-handler हटाए जाते हैं।
 */
function sanitizeEditorHtml(html) {

  const wrapper =
    document.createElement("div");

  wrapper.innerHTML =
    String(html || "");

  wrapper
    .querySelectorAll(
      "script, iframe, object, embed"
    )
    .forEach((element) => {
      element.remove();
    });

  wrapper
    .querySelectorAll("*")
    .forEach((element) => {

      [...element.attributes]
        .forEach((attribute) => {

          const name =
            attribute.name.toLowerCase();

          const value =
            attribute.value.trim()
              .toLowerCase();

          if (name.startsWith("on")) {
            element.removeAttribute(
              attribute.name
            );
          }

          if (
            (
              name === "href" ||
              name === "src"
            ) &&
            value.startsWith(
              "javascript:"
            )
          ) {
            element.removeAttribute(
              attribute.name
            );
          }
        });
    });

  return wrapper.innerHTML.trim();
}


/* =========================================================
   Slug
   ========================================================= */

function slugify(text) {

  return String(text || "")
    .trim()
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[^\p{L}\p{N}\s-]/gu, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}


function generateSlug() {

  const title =
    document.getElementById(
      "title"
    ).value;

  if (slugManuallyEdited) {
    return;
  }

  const slug =
    slugify(title);

  document.getElementById(
    "slug"
  ).value = slug;

  markUnsaved();
}


function updateSlugPreview() {

  const slug =
    document.getElementById(
      "slug"
    ).value.trim();

  const preview =
    document.getElementById(
      "slugPreview"
    );

  if (preview) {

    preview.textContent =
      slug
        ? `/article.html?slug=${slug}`
        : "/article.html?slug=...";
  }
}


/* =========================================================
   Tags
   ========================================================= */

function renderTags() {

  const container =
    document.getElementById(
      "tagsContainer"
    );

  if (!container) {
    return;
  }

  container.innerHTML = "";

  currentTags.forEach(
    (tag, index) => {

      const item =
        document.createElement(
          "span"
        );

      item.className =
        "tag-chip";

      item.innerHTML = `
        <span>${escapeHtml(tag)}</span>
        <button
          type="button"
          aria-label="टैग हटाएँ"
          onclick="removeTag(${index})"
        >
          ×
        </button>
      `;

      container.appendChild(item);
    }
  );
}


function addTag(value) {

  const tag =
    String(value || "")
      .trim()
      .replace(/,+$/, "");

  if (!tag) {
    return;
  }

  const exists =
    currentTags.some(
      (item) =>
        item.toLowerCase() ===
        tag.toLowerCase()
    );

  if (!exists) {
    currentTags.push(tag);
  }

  renderTags();

  const input =
    document.getElementById(
      "tagsInput"
    );

  if (input) {
    input.value = "";
  }

  markUnsaved();
}


function removeTag(index) {

  currentTags.splice(
    index,
    1
  );

  renderTags();

  markUnsaved();
}


function handleTagInput(event) {

  if (
    event.key === "Enter" ||
    event.key === ","
  ) {

    event.preventDefault();

    addTag(event.target.value);
  }
}

function addSource(
  title = "",
  url = ""
) {

  const container =
    document.getElementById(
      "sourcesContainer"
    );

  if (!container) {
    return;
  }

  sourceCounter += 1;

    document.createElement(
      "div"
    );

    "source-item";

  item.dataset.sourceId =
    sourceCounter;

  item.innerHTML = `
    <div class="source-number">
      स्रोत ${sourceCounter}
    </div>

    <div class="form-group">
      <label>
        स्रोत का नाम
      </label>

        type="text"
        class="source-title"
        value="${escapeHtml(title)}"

      />
    </div>

    <div class="form-group">

      </label>

      <input
        type="url"
        class="source-url"
        value="${escapeHtml(url)}"

      type="button"
      class="btn btn-danger btn-small"
      onclick="removeSource(this)"
    >

    </button>
  `;

  container.appendChild(item);

  markUnsaved();
}


function removeSource(button) {

  const item =
    button.closest(
      ".source-item"
    );

  if (!item) {
    return;
  }

  item.remove();

  renumberSources();

  markUnsaved();
}


function renumberSources() {

  const items =
    document.querySelectorAll(
      ".source-item"
    );

  items.forEach(
    (item, index) => {

      const number =
        item.querySelector(
          ".source-number"
        );

      if (number) {

        number.textContent =
          `स्रोत ${index + 1}`;
      }
    }
  );

  sourceCounter =
    items.length || 1;
}

/* =========================================================
   Editor Statistics
   ========================================================= */

function getEditorText() {

  const editor =
    document.getElementById(
      "articleContent"
    );

  if (!editor) {
    return "";
  }

  return editor.textContent
    .replace(/\s+/g, " ")
    .trim();
}


function updateEditorStats() {

  const text =
    getEditorText();

  const words =
    text
      ? text.split(/\s+/).length
      : 0;

  const wordCount =
    document.getElementById(
      "wordCount"
    );

  if (wordCount) {

    wordCount.textContent =
      `${words.toLocaleString("hi-IN")} शब्द`;
  }

  const readingTime =
    document.getElementById(
      "readingTime"
    );

  if (readingTime) {

    const minutes =
      words > 0
        ? Math.max(
            1,
            Math.ceil(words / 200)
          )
        : 0;

    readingTime.textContent =
      `${minutes} मिनट पढ़ने का समय`;
  }
}

      const title =
        item.querySelector(

      const url =
        item.querySelector(
          ".source-url"

      if (title || url) {

          title,
          url

function validateArticle() {

  const title =
    document.getElementById(
      "title"

      "slug"
    )?.value.trim();

  const category =

      "error"
    );

  }

      "error"
    );

    document.getElementById(
      "slug"
    )?.focus();

    return false;
  }

  if (!category) {

    showToast(
      "कृपया लेख की श्रेणी चुनें।",
      "error"
    );

    document.getElementById(
      "category"
    )?.focus();

    return false;
  }

  if (!author) {

    showToast(
      "लेखक का नाम आवश्यक है।",
      "error"
    );

    document.getElementById(
      "author"
    )?.focus();

    return false;
  }

  if (!excerpt) {

    showToast(
      "लेख का संक्षिप्त विवरण दर्ज करें।",
      "error"
    );

    document.getElementById(
      "excerpt"
    )?.focus();

    return false;
  }

  if (!content) {

    showToast(

      "error"
    );

    document.getElementById(
      "articleContent"
    )?.focus();

    return false;
  }

  return true;
}

function applyArticleToForm(article) {

  document.getElementById(

  document.getElementById(

  document.getElementById(

  ).value =

  document.getElementById(
    "author"
  ).value =
    article.author || "";

  document.getElementById(
    "excerpt"
  ).value =
    article.excerpt || "";

  document.getElementById(
    "publishDate"
  ).value =
    article.publishDate || "";

  document.getElementById(

  ).value =
    article.visibility || "public";

  document.getElementById(
    "featuredImage"
  ).value =
    article.featuredImage || "";

  document.getElementById(
    "seoTitle"
  ).value =
    article.seo?.title || "";

  document.getElementById(
    "seoDescription"
  ).value =
    article.seo?.description || "";

  document.getElementById(
    "articleContent"
  ).innerHTML =
    sanitizeEditorHtml(
      article.content || ""
    );


  /*
   * Tags
   */

  currentTags =
    Array.isArray(article.tags)
      ? [...article.tags]
      : [];

  renderTags();


  /*
   * Options
   */

  document.getElementById(
    "optionFeatured"
  ).checked =
    Boolean(
      article.options?.featured
    );

  document.getElementById(
    "optionBreaking"
  ).checked =
    Boolean(
      article.options?.breaking
    );

  document.getElementById(
    "optionComments"
  ).checked =
    article.options?.comments !== false;

  document.getElementById(
    "optionRelated"
  ).checked =
    article.options?.related !== false;


  /*
   * Fact Check
   */

  document.getElementById(
    "fcPrimarySource"
  ).checked =
    Boolean(
      article.factCheck?.primarySource
    );

  document.getElementById(
    "fcNamesDatesLocations"
  ).checked =
    Boolean(
      article.factCheck?.namesDatesLocations
    );

  document.getElementById(
    "fcMajorClaims"
  ).checked =
    Boolean(
      article.factCheck?.majorClaims
    );

  document.getElementById(
    "fcMediaContext"
  ).checked =
    Boolean(
      article.factCheck?.mediaContext
    );


  /*
   * Sources
   */

  const sourcesContainer =
    document.getElementById(
      "sourcesContainer"
    );

  sourcesContainer.innerHTML = "";

  sourceCounter = 0;

  if (
    Array.isArray(article.sources) &&
    article.sources.length
  ) {

    article.sources.forEach(
      (source) => {

        addSource(
          source.title || "",
          source.url || ""
        );
      }
    );

  } else {

    addSource();
  }


  /*
   * Status
   */

  updateStatusUI(
    article.status || "draft"
  );


  /*
   * Featured image
   */

  updateFeaturedImage();

  updateSlugPreview();

  updateEditorStats();

  markSaved();
}

/* =========================================================
   Draft Loading
   ========================================================= */

function loadDraft() {

  const raw =
    localStorage.getItem(
      DRAFT_KEY
    );

  if (!raw) {
    return false;
  }

  try {

    const article =
      JSON.parse(raw);

    if (!article) {
      return false;
    }

    applyArticleToForm(
      article
    );

    showToast(
      "पिछला ड्राफ्ट लोड किया गया।"
    );

    return true;

  } catch (error) {

    console.error(
      "Draft load error:",
      error
    );

    showToast(
      "ड्राफ्ट लोड नहीं हो पाया।",
      "error"
    );

    return false;
  }
}


/* =========================================================
   Default Publish Date
   ========================================================= */

function setDefaultPublishDate() {

  const input =
    document.getElementById(
      "publishDate"
    );

  if (!input || input.value) {
    return;
  }

  const now =
    new Date();

  const localDate =
    new Date(
      now.getTime() -
      now.getTimezoneOffset() *
        60000
    )
      .toISOString()
      .slice(0, 10);

  input.value =
    localDate;
  }

function setupEditorEvents() {

  const title =
    document.getElementById(
      "title"
    );

  const slug =
    document.getElementById(
      "slug"
    );

  const editor =
    document.getElementById(

      "input",
      () => {

        slugManuallyEdited =
          true;

        slug.value =
          slugify(slug.value);

        updateSlugPreview();

        markUnsaved();
      }
    );
  }


  if (editor) {

    editor.addEventListener(
      "input",
      () => {

        updateEditorStats();

        markUnsaved();
      }
    );

    editor.addEventListener(
      "paste",
      (event) => {

        event.preventDefault();

        const text =
          (
            event.clipboardData ||
            window.clipboardData
          ).getData(
            "text/plain"
          );

        document.execCommand(
          "insertText",
          false,
          text
        );

        updateEditorStats();

        markUnsaved();
      }
    );
  }


  if (tagsInput) {

    tagsInput.addEventListener(
      "keydown",
      handleTagInput
    );
  }


  if (featuredImage) {

    featuredImage.addEventListener(
      "input",
      updateFeaturedImage
    );
  }


  document
    .querySelectorAll(
      "input, textarea, select"
    )
    .forEach(
      (element) => {

        element.addEventListener(
          "change",
          () => {

            markUnsaved();
          }
        );
      }
    );


  document.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key ===
        "Escape"
      ) {

        closePreview();
      }
    }
  );


  document.addEventListener(
    "keydown",
    (event) => {

      if (
        (
          event.ctrlKey ||
          event.metaKey
        ) &&
        event.key.toLowerCase() ===
          "s"
      ) {

        event.preventDefault();

        saveDraft();
      }
    }
  );


  document.addEventListener(
    "keydown",
    (event) => {

      if (
        (
          event.ctrlKey ||
          event.metaKey
        ) &&
        event.key ===
          "Enter"
      ) {

        event.preventDefault();

        publishArticle();
      }
    }
  );
}

      );
    }
  }

  const article =
    collectArticleData();

  /*
   * Existing draft की पहचान और creation time
   * सुरक्षित रखें।
   */

  if (existingArticle?.id) {

    article.id =
      existingArticle.id;
  }

  article.createdAt =
    existingArticle?.createdAt ||
    new Date().toISOString();

  article.status =
    "draft";

  article.publishedAt =
    existingArticle?.publishedAt ||
    null;

  article.updatedAt =
    new Date().toISOString();


  localStorage.setItem(
    DRAFT_KEY,
    JSON.stringify(article)
  );


  updateStatusUI(
    "draft"
  );

  markSaved();

  showToast(
    "ड्राफ्ट सफलतापूर्वक सहेजा गया।"
  );
}


/* =========================================================
   Publish Article
   ========================================================= */

function publishArticle() {

  if (!validateArticle()) {
    return;
  }


  const article =
    collectArticleData();


  /*
   * Fact Check स्थिति
   */

  const factChecks = [
    article.factCheck.primarySource,
    article.factCheck.namesDatesLocations,
    article.factCheck.majorClaims,
    article.factCheck.mediaContext
  ];

  const factCheckComplete =
    factChecks.every(Boolean);


  if (!factCheckComplete) {

    const continuePublishing =
      confirm(
        "तथ्य-जाँच (Fact Check) अभी पूरी नहीं हुई है।\n\n" +
        "क्या आप फिर भी इस लेख को प्रकाशित करना चाहते हैं?"
      );

    if (!continuePublishing) {
      return;
    }
  }


  /*
   * अंतिम पुष्टि
   */

  const confirmed =
    confirm(
      "क्या आप इस लेख को प्रकाशित करना चाहते हैं?"
    );

  if (!confirmed) {
    return;
  }


  /*
   * Existing draft की ID और creation time रखें।
   */

  const existingRaw =
    localStorage.getItem(
      DRAFT_KEY
    );

  let existingArticle = null;

  if (existingRaw) {

    try {

      existingArticle =
        JSON.parse(
          existingRaw
        );

    } catch (error) {

      console.warn(
        "Draft parse error during publish:",
        error
      );
    }
  }


  if (existingArticle?.id) {

    article.id =
      existingArticle.id;
  }


  article.createdAt =
    existingArticle?.createdAt ||
    new Date().toISOString();


  article.status =
    "published";


  article.publishedAt =
    new Date().toISOString();


  article.updatedAt =
    new Date().toISOString();


  /*
   * Published article
   */

  localStorage.setItem(
    PUBLISHED_KEY,
    JSON.stringify(article)
  );


  /*
   * Draft copy भी updated रहे।
   */

  localStorage.setItem(
    DRAFT_KEY,
    JSON.stringify(article)
  );


  /*
   * UI status
   */

  updateStatusUI(
    "published"
  );


  const publishedDateText =
    document.getElementById(
      "publishedDateText"
    );

  if (publishedDateText) {

    publishedDateText.textContent =
      new Date(
        article.publishedAt
      ).toLocaleString(
        "hi-IN",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );
  }


  markSaved();


  showToast(
    "लेख सफलतापूर्वक प्रकाशित हो गया।"
  );
}


/* =========================================================
   Editor Initialization
   ========================================================= */

function initializeEditor() {

  /*
   * Default date
   */

  setDefaultPublishDate();


  /*
   * Event listeners
   */

  setupEditorEvents();


  /*
   * Existing draft restore
   */

  const draftLoaded =
    loadDraft();


  /*
   * यदि draft नहीं मिला तो
   * नया source field रखें।
   */

  if (!draftLoaded) {

    const sourcesContainer =
      document.getElementById(
        "sourcesContainer"
      );

    if (
      sourcesContainer &&
      !sourcesContainer.querySelector(
        ".source-item"
      )
    ) {

      sourceCounter = 0;

      addSource();
    }

    updateStatusUI(
      "draft"
    );

    updateFeaturedImage();

    updateSlugPreview();

    updateEditorStats();

    markSaved();
  }


  /*
   * Tags
   */

  renderTags();


  /*
   * Initial slug preview
   */

  updateSlugPreview();


  /*
   * Initial statistics
   */

  updateEditorStats();
}


/* =========================================================
   DOM Ready
   ========================================================= */

if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    initializeEditor
  );

} else {

  initializeEditor();
}


/* =========================================================
   Preview Modal — बाहर click करने पर बंद
   ========================================================= */

document.addEventListener(
  "click",
  (event) => {

    const modal =
      document.getElementById(
        "previewModal"
      );

    if (
      modal &&
      event.target === modal
    ) {

      closePreview();
    }
  }
);


/* =========================================================
   Article Editor समाप्त
   ========================================================= */
</script>

</body>
</html>
